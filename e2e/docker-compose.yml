services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${E2E_MSSQL_SA_PASSWORD:?set by e2e/stack/infra.ts}
    ports:
      - '127.0.0.1:${E2E_MSSQL_PORT:?set by e2e/stack/infra.ts}:1433'
    tmpfs:
      - /var/opt/mssql/data
      - /var/opt/mssql/log
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --inMemoryPersistence --loose --skipApiVersionCheck
    ports:
      - '127.0.0.1:${E2E_AZURITE_PORT:?set by e2e/stack/infra.ts}:10000'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 10000']
      interval: 2s
      timeout: 3s
      retries: 30
